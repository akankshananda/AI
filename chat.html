<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamForge - AI Chat</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ExamForge
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="study.html">Study</a>
            <a href="quiz.html">Quiz</a>
            <a href="writing.html">Writing</a>
            <a href="chat.html">AI Chat</a>
        </div>

    </nav>

    <main class="chat-page">

        <div class="page-header">
            <h1>AI Academic Assistant</h1>
            <p>Ask questions and get academic explanations.</p>
        </div>

        <div class="chat-container">

            <div class="chat-messages" id="chat-messages">

                <div class="message ai-message">
                    Hello! I am your ExamForge academic assistant.
                    How can I help you?
                </div>

            </div>

            <div class="chat-input">

                <input
                    type="text"
                    id="chat-input"
                    placeholder="Ask an academic question..."
                    onkeydown="handleChatKey(event)"
                >

                <button onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 ExamForge | AI Academic Copilot</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>

</body>

</html>
